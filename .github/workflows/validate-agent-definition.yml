name: Validate Agent Definition examples

on:
  push:
    branches: [main]
    paths:
      - "Agents/agent-definition/**"
      - ".github/workflows/validate-agent-definition.yml"
  pull_request:
    paths:
      - "Agents/agent-definition/**"
      - ".github/workflows/validate-agent-definition.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema (pinned)
        run: pip install jsonschema==4.10.3

      - name: Validate every example against the schema
        run: python3 Agents/agent-definition/validate.py

      - name: Guard anyOf (not oneOf) for the name/role rule
        run: python3 Agents/agent-definition/test_anyof_vs_oneof.py
